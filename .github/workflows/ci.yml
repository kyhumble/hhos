name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Build shared + db
        run: pnpm --filter @hhos/shared build && pnpm --filter @hhos/db build

      - name: Typecheck
        run: pnpm typecheck

      # API unit suite: photo crypto vectors, dual-S3 client construction (no live MinIO),
      # wound-photo control plane, features, redact. Compose MinIO is for local smoke only —
      # see README "CI & MinIO" and docs/architecture/phase-2-kpis.md.
      - name: API unit tests
        run: pnpm --filter @hhos/api test

      - name: Guard — no Cognito required in CI, but fail if prod secrets committed
        run: |
          if grep -R "BEGIN RSA PRIVATE KEY" --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null; then
            echo "Private key material found in repo"
            exit 1
          fi
          echo "Secret scan basic check OK"
