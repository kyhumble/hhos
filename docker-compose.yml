# Local non-PHI development stack. Do not load real ePHI into these services.
services:
  postgres:
    image: postgres:16-alpine
    container_name: hhos-postgres
    environment:
      POSTGRES_USER: hhos
      POSTGRES_PASSWORD: hhos_dev
      POSTGRES_DB: hhos
    ports:
      - "5432:5432"
    volumes:
      - hhos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hhos -d hhos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hhos-redis
    ports:
      - "6379:6379"
    volumes:
      - hhos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: hhos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hhosminio
      MINIO_ROOT_PASSWORD: hhosminio_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hhos_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: hhos-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 hhosminio hhosminio_dev_secret;
      mc mb -p local/hhos-documents || true;
      mc anonymous set none local/hhos-documents;
      exit 0;
      "

volumes:
  hhos_pg_data:
  hhos_redis_data:
  hhos_minio_data:
